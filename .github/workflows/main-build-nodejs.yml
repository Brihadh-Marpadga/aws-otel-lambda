stages: [build]

variables:
  # >>> Change this if your submodule lives elsewhere
  SUBMODULE_DIR: "vendor/opentelemetry-lambda"   # e.g., "opentelemetry-lambda" or "third_party/otel-lambda"
  NODEJS_DIR: "$SUBMODULE_DIR/nodejs"

  GO_VERSION: "1.23.3"        # bump to 1.24.x if you truly need it
  GOOS: "linux"
  CGO_ENABLED: "0"
  GIT_SUBMODULE_STRATEGY: recursive

  # caches
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

build-nodejs-layer:
  stage: build
  image: node:18-bullseye
  parallel:
    matrix:
      - ARCH: ["amd64", "arm64"]
        RUNTIME: ["nodejs18.x", "nodejs20.x", "nodejs22.x"]
  cache:
    - key: "go-${CI_COMMIT_REF_SLUG}"
      paths:
        - .cache/go/pkg/mod
        - .cache/go/bin
    - key: "npm-${CI_COMMIT_REF_SLUG}"
      paths:
        - .cache/npm
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends zip rsync findutils coreutils curl ca-certificates git tar
    # Install Go
    - curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
    - rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz
    - export PATH="/usr/local/go/bin:$GOPATH/bin:$PATH"
    # Ensure submodules are present (in case runner ignores GIT_SUBMODULE_STRATEGY)
    - git submodule sync --recursive
    - git submodule update --init --recursive
    # Sanity: show where the submodule actually is
    - echo "SUBMODULE_DIR=$SUBMODULE_DIR"
    - test -d "$SUBMODULE_DIR" || { echo "Submodule not found at $SUBMODULE_DIR"; exit 1; }
    - test -d "$NODEJS_DIR" || { echo "nodejs dir not found at $NODEJS_DIR"; ls -la "$SUBMODULE_DIR"; exit 1; }
    - node -v && npm -v && go version
  script:
    - |
      set -euo pipefail
      echo ">>> Building for ARCH=${ARCH}"
      if [ "${ARCH}" = "amd64" ]; then
        export LAMBDA_FUNCTION_ARCH=x86_64
      else
        export LAMBDA_FUNCTION_ARCH=arm64
      fi
      export GOARCH="${ARCH}"
      mkdir -p "$GOMODCACHE" "$GOPATH/bin" "$NPM_CONFIG_CACHE"

      pushd "$NODEJS_DIR" >/dev/null
      ./build.sh "${ARCH}"
      popd >/dev/null

      echo ">>> ZIPs produced under $SUBMODULE_DIR:"
      find "$SUBMODULE_DIR" -type f -name '*.zip' | sed 's/^/ - /'
  artifacts:
    when: always
    name: "nodejs-layer-${RUNTIME}-${ARCH}-${CI_JOB_ID}"
    expire_in: 14 days
    paths:
      - $SUBMODULE_DIR/**/*.zip
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
